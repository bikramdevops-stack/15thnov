trigger:
 - main
 - feature/*

pool: mypool

stages:
  - stage: security
    displayName: security
    jobs:
      - job: security
        displayName: security
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tfsec'
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tflint --recursive --force'


  - stage: validate
    displayName: validate
    jobs:
      - job: validate
        displayName: validate
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'devopsservice'
            backendAzureRmStorageAccountName: 'storagepipeline11'
            backendAzureRmContainerName: 'mycontainer'
            backendAzureRmKey: 'raj.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'


  - stage: plan
    displayName: plan
    jobs:
      - job: 
        displayName: plan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'devopsservice'
            backendAzureRmStorageAccountName: 'storagepipeline11'
            backendAzureRmContainerName: 'mycontainer'
            backendAzureRmKey: 'raj.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            environmentServiceNameAzureRM: 'devopsservice'


  - stage: Approval
    pool: server
    displayName: Approval
    jobs:
      - job: Approval
        displayName: Approval
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'asdhasjdsh@ancsfl'

  - stage: Apply
    dependsOn: Approval
    displayName: Apply
    jobs:
      - job: Apply
        displayName: Apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'devopsservice'
            backendAzureRmStorageAccountName: 'storagepipeline11'
            backendAzureRmContainerName: 'mycontainer'
            backendAzureRmKey: 'raj.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            environmentServiceNameAzureRM: 'devopsservice'
